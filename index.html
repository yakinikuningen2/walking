<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>散歩アプリ</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="static/css/style.css" />
  </head>
  <body>
    <div id="setup-screen" class="setup-screen" role="dialog" aria-modal="true" aria-labelledby="setup-heading" hidden>
      <form id="walking-settings-form" class="walking-settings">
        <h1 id="setup-heading">歩く速さ</h1>
        <fieldset class="speed-options">
          <legend class="sr-only">速さを選ぶ</legend>
          <label class="speed-option"><input type="radio" name="walking-speed" value="slow" required /><span>ゆっくり</span><small>3.0 km/h</small></label>
          <label class="speed-option"><input type="radio" name="walking-speed" value="normal" checked /><span>ふつう</span><small>4.0 km/h</small></label>
          <label class="speed-option"><input type="radio" name="walking-speed" value="fast" /><span>はやめ</span><small>5.5 km/h</small></label>
          <div class="custom-speed-row"><label class="speed-option"><input type="radio" name="walking-speed" value="custom" /><span>数値で指定</span></label><span class="speed-value"><output id="custom-speed-value" for="custom-walking-speed">4.0</output><small>km/h</small></span></div>
          <div class="custom-speed-field">
            <label class="sr-only" for="custom-walking-speed">歩く速さ（時速）</label>
            <input id="custom-walking-speed" type="range" min="2.5" max="6.5" step="0.1" value="4" aria-describedby="custom-speed-help" />
          </div>
          <div class="speed-scale" aria-hidden="true"><span>2.5</span><span>6.5 km/h</span></div>
          <p id="custom-speed-help" class="sr-only">時速2.5〜6.5 kmを0.1刻みで調整できます。</p>
        </fieldset>
        <p id="settings-status" class="status" role="status" aria-live="polite"></p>
        <div class="settings-actions"><button id="open-map" class="open-map-button" type="submit">保存</button></div>
      </form>
    </div>
    <div id="discovery-screen" class="setup-screen" role="dialog" aria-modal="true" aria-labelledby="discovery-heading" hidden>
      <div class="discovery-panel">
        <div class="discovery-heading"><h2 id="discovery-heading">条件で探す</h2><button id="close-discovery" type="button">閉じる</button></div>
        <form id="discovery-form">
          <div class="discovery-fields">
            <div><label for="discovery-kind">場所の種類</label><select id="discovery-kind"><option value="any">こだわらない</option><option value="park">公園・緑地</option><option value="cafe">カフェ</option><option value="restaurant">食事</option><option value="sightseeing">景色・観光</option><option value="culture">美術館・博物館</option><option value="shrine">神社・寺院</option><option value="shopping">買い物</option><option value="convenience">コンビニ</option></select></div>
            <div><label for="discovery-ambience">雰囲気</label><select id="discovery-ambience"><option value="any">こだわらない</option><option value="urban">都会寄り</option><option value="rural">田舎寄り</option><option value="nature">自然が多い</option></select></div>
          </div>
          <fieldset class="discovery-time"><legend>歩ける時間（片道）</legend><label><input id="discovery-hours" type="number" min="0" step="1" value="0" required />時間</label><label><input id="discovery-minutes" type="number" min="0" max="59" step="1" value="30" required />分</label></fieldset>
          <label for="discovery-keyword">希望・キーワード <span class="optional">（任意）</span></label>
          <input id="discovery-keyword" type="text" maxlength="80" placeholder="例：田舎 カフェ" />
          <fieldset class="discovery-conditions"><legend>あるとうれしい <span class="optional">（任意）</span></legend><label><input id="discovery-free" type="checkbox" />無料</label><label><input id="discovery-toilets" type="checkbox" />近くにトイレ</label><label><input id="discovery-benches" type="checkbox" />近くにベンチ</label></fieldset>
          <p class="discovery-help">5分以上で指定できます。希望に近い場所を優先します。雰囲気は周辺情報からの目安です。</p>
          <div class="settings-actions"><button id="discovery-submit" type="submit">候補を探す</button></div>
        </form>
        <p id="discovery-status" class="status" role="status" aria-live="polite"></p>
        <ul id="discovery-results" class="place-list" aria-label="希望に近い目的地"></ul>
      </div>
    </div>
    <div class="app-shell" hidden inert>
      <button id="panel-toggle" class="panel-toggle" type="button" aria-controls="search-panel" aria-expanded="false" aria-label="場所を登録：開く" title="右に引っ張ると開きます"><span class="panel-label">場所を登録</span><span class="panel-chevron" aria-hidden="true">›</span></button>
      <aside id="search-panel" class="sidebar" aria-label="場所の検索と散歩の記録" aria-hidden="true" inert>
        <section aria-label="場所の検索">
          <label class="search-label" for="search-input">場所を検索</label>
          <form id="search-form" class="search-form" role="search">
            <input id="search-input" type="search" placeholder="場所の名前・住所" maxlength="200" />
            <button id="search-button" type="button" aria-label="検索" title="検索"></button>
          </form>
          <p id="search-status" class="status" role="status" aria-live="polite"></p>
          <ul id="search-results" class="place-list" aria-label="検索結果"></ul>
        </section>
        <section id="place-editor" class="editor" aria-label="場所の記録" hidden>
          <p id="selected-address" class="address"></p>
          <form id="visit-form">
            <label for="visit-name">場所の名前</label>
            <input id="visit-name" maxlength="120" required />
            <label for="visit-date">訪問日</label>
            <input id="visit-date" type="date" required />
            <label for="visit-note">メモ <span class="optional">（任意）</span></label>
            <textarea id="visit-note" rows="3" maxlength="1000"></textarea>
            <div class="actions">
              <button id="set-destination" type="button" class="secondary">目的地に指定</button>
              <div class="record-save-actions">
                <button id="cancel-selection" type="button" class="secondary">キャンセル</button>
                <button id="save-button" type="submit">保存</button>
              </div>
            </div>
          </form>
        </section>
        <p id="visit-status" class="status" role="status" aria-live="polite"></p>
        <button id="undo-delete" type="button" class="secondary" hidden>削除を取り消す</button>
        <section aria-label="保存した場所">
          <span id="visit-count" class="count">0件</span>
          <p id="visits-empty" class="sr-only">記録なし</p>
          <ul id="visits-list" class="place-list" aria-label="保存した場所"></ul>
        </section>
      </aside>
      <main id="map" aria-label="散歩用の地図"></main>
      <div class="map-utility-actions" role="group" aria-label="地図の操作">
        <button id="location-button" type="button">現在地</button>
        <button id="edit-walking-settings" type="button" class="secondary">歩く速さ</button>
      </div>
      <section class="map-destination-search" aria-label="目的地の検索">
        <label class="sr-only" for="destination-search-input">目的地を検索</label>
        <form id="destination-search-form" class="search-form" role="search">
          <input id="destination-search-input" type="search" placeholder="目的地の名前・住所" maxlength="200" />
          <button id="destination-search-button" type="button" aria-label="目的地を検索" title="検索"></button>
        </form>
        <p id="destination-search-status" class="status" role="status" aria-live="polite"></p>
        <ul id="destination-search-results" class="place-list" aria-label="目的地の検索結果"></ul>
        <button id="open-discovery" class="discovery-toggle" type="button" aria-haspopup="dialog" aria-controls="discovery-screen">条件で探す</button>
      </section>
      <div class="map-legend" role="note" aria-label="地点の凡例">
        <span class="legend-item"><span class="legend-dot registered" aria-hidden="true"></span>登録地点</span>
        <span class="legend-item"><span class="legend-dot selected" aria-hidden="true"></span>選択地点</span>
        <span id="location-legend" class="legend-item" hidden><span class="legend-dot current" aria-hidden="true"></span>現在地</span>
        <span id="destination-legend" class="legend-item" hidden><span class="legend-dot destination" aria-hidden="true"></span>目的地</span>
      </div>
      <div class="location-controls">
        <div id="destination-panel" class="destination-panel" role="group" aria-labelledby="destination-heading" hidden>
          <p id="destination-heading" class="destination-heading">目的地</p>
          <p id="destination-name" aria-live="polite"></p>
          <p id="destination-address" class="address" hidden></p>
          <div class="destination-actions">
            <button id="route-button" type="button" aria-describedby="route-status">徒歩ルートを表示</button>
            <button id="clear-destination" type="button" class="secondary">目的地を解除</button>
          </div>
        </div>
        <p id="route-status" class="status" role="status" aria-live="polite"></p>
        <div id="route-panel" class="route-panel" role="region" aria-labelledby="route-heading" hidden>
          <h2 id="route-heading">徒歩ルート</h2>
          <ul id="route-options" class="route-options" aria-label="見つかったルート候補" hidden></ul>
          <p id="route-choice-note" class="route-choice-note"></p>
          <p id="route-summary"></p>
          <details id="route-directions">
            <summary>道順</summary>
            <ol id="route-steps"></ol>
          </details>
          <button id="clear-route" type="button" class="secondary">案内を終了</button>
        </div>
        <p id="location-status" class="status" role="status" aria-live="polite"></p>
      </div>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="static/js/app.js"></script>
  </body>
</html>
